<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Imperial Measurement Calculator</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: "Google Sans", sans-serif;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 20px;
		}

		.calculator {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
			padding: 40px;
			max-width: 500px;
			width: 100%;
		}

		h1 {
			text-align: center;
			color: #333;
			margin-bottom: 30px;
			font-size: 24px;
		}

		.display {
			margin-bottom: 20px;
		}

		.result-display {
			background: #f8f9fa;
			padding: 15px;
			border-radius: 8px;
			min-height: 50px;
			margin-bottom: 10px;
			font-size: 18px;
			color: #666;
			display: flex;
			align-items: center;
		}

		input[type="text"] {
			width: 100%;
			padding: 15px;
			border: 2px solid #ddd;
			border-radius: 8px;
			font-size: 20px;
			font-weight: 500;
			transition: border-color 0.3s;
		}

		input[type="text"]:focus {
			outline: none;
			border-color: #667eea;
		}

		.help-text {
			font-size: 12px;
			color: #888;
			margin-top: 5px;
		}

		.button-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 10px;
			margin-bottom: 15px;
		}

		button {
			font-family: inherit;
			padding: 15px;
			border: none;
			border-radius: 8px;
			font-size: 18px;
			font-weight: bold;
			cursor: pointer;
			transition: all 0.3s;
			color: white;
		}

		.op-btn {
			background: #667eea;
		}

		.op-btn:hover {
			background: #5568d3;
			transform: translateY(-2px);
		}

		.equals-btn {
			background: #27ae60;
			grid-column: span 2;
		}

		.equals-btn:hover {
			background: #229954;
			transform: translateY(-2px);
		}

		.clear-btn {
			background: #e74c3c;
		}

		.clear-btn:hover {
			background: #c0392b;
			transform: translateY(-2px);
		}

		.convert-group {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
			margin-bottom: 15px;
		}

		.convert-btn {
			background: #3498db;
			padding: 12px;
			font-size: 14px;
		}

		.convert-btn:hover {
			background: #2980b9;
			transform: translateY(-2px);
		}

		.convert-btn:disabled {
			background: #bdc3c7;
			cursor: not-allowed;
			transform: none;
		}

		.history {
			margin-top: 30px;
			padding-top: 30px;
			border-top: 2px solid #eee;
		}

		.history-header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 15px;
		}

		.history-title {
			font-size: 18px;
			font-weight: bold;
			color: #333;
		}

		.clear-history-btn {
			background: #e74c3c;
			padding: 8px 15px;
			font-size: 14px;
			border-radius: 6px;
		}

		.clear-history-btn:hover {
			background: #c0392b;
		}

		.history-list {
			max-height: 300px;
			overflow-y: auto;
		}

		.history-item {
			background: #f8f9fa;
			padding: 12px 15px;
			border-radius: 8px;
			margin-bottom: 10px;
			border-left: 4px solid #667eea;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}

		.history-item-content {
			flex: 1;
			font-size: 14px;
			line-height: 1.6;
		}

		.history-item-content small {
			font-size: 12px;
		}

		.history-item-delete {
			background: #e74c3c;
			color: white;
			border: none;
			padding: 5px 10px;
			border-radius: 4px;
			font-size: 12px;
			cursor: pointer;
			margin-left: 10px;
		}

		.history-item-delete:hover {
			background: #c0392b;
		}

		.history-empty {
			text-align: center;
			color: #999;
			padding: 20px;
			font-style: italic;
		}

		.modal {
			display: none;
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.5);
			z-index: 1000;
			justify-content: center;
			align-items: center;
		}

		.modal.show {
			display: flex;
		}

		.modal-content {
			background: white;
			padding: 30px;
			border-radius: 15px;
			max-width: 400px;
			width: 90%;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
		}

		.modal-title {
			font-size: 20px;
			font-weight: bold;
			margin-bottom: 15px;
			color: #333;
		}

		.modal-buttons {
			display: flex;
			gap: 10px;
			margin-top: 20px;
		}

		.modal-btn {
			flex: 1;
			padding: 12px;
			font-size: 16px;
		}

		.modal-btn-yes {
			background: #e74c3c;
		}

		.modal-btn-yes:hover {
			background: #c0392b;
		}

		.modal-btn-cancel {
			background: #95a5a6;
		}

		.modal-btn-cancel:hover {
			background: #7f8c8d;
		}

		.error {
			color: #e74c3c;
			font-size: 14px;
			margin-top: 5px;
		}
	</style>
</head>

<body>
	<div class="calculator">
		<h1>Imperial Measurement Calculator</h1>

		<div class="display">
			<div class="result-display" id="resultDisplay">—</div>
			<input type="text" id="equationInput" placeholder="Enter measurement...">
			<div class="help-text">
				Formats: 3' 6", 3.5', 6 1/2", 2' 4 3/8". <br>
				Without " or ' abbreviation, number defaults to inches <br>
				Operators must have spaces around them.
				Rounds to nearest 1/16th inch.
			</div>
			<div class="error" id="error"></div>
		</div>

		<div class="button-grid">
			<button class="op-btn" onclick="addOperator('+')">+</button>
			<button class="op-btn" onclick="addOperator('-')">−</button>
			<button class="op-btn" onclick="addOperator('*')">×</button>
			<button class="op-btn" onclick="addOperator('/')">÷</button>
			<button class="equals-btn" onclick="calculateResult()">=</button>
			<button class="clear-btn" onclick="clearAll()">Clear</button>
		</div>

		<div class="convert-group">
			<button class="convert-btn" id="unitConvertBtn" onclick="toggleUnitDisplay()" disabled>Convert to
				Inches</button>
			<button class="convert-btn" id="decimalConvertBtn" onclick="toggleDecimalDisplay()" disabled>Convert to
				Decimal</button>
		</div>

		<div class="history">
			<div class="history-header">
				<div class="history-title">Calculation History</div>
				<button class="clear-history-btn" onclick="showClearHistoryModal()">Clear History</button>
			</div>
			<div class="history-list" id="historyList">
				<div class="history-empty">No calculations saved yet</div>
			</div>
		</div>
	</div>

	<div class="modal" id="confirmModal">
		<div class="modal-content">
			<div class="modal-title">Are you sure?</div>
			<div id="modalMessage"></div>
			<div class="modal-buttons">
				<button class="modal-btn modal-btn-yes" onclick="confirmAction()">Yes</button>
				<button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancel</button>
			</div>
		</div>
	</div>

	<script>
		let calculationHistory = [];
		let currentResult = null;
		let currentResultInches = null;
		let displayInInchesOnly = false;
		let displayAsDecimal = false;
		let pendingModalAction = null;
		const MAX_HISTORY = 20;
		const STORAGE_KEY = 'imperialCalcHistory';

		// Load history from memory storage on startup
		function loadHistory() {
			const stored = sessionStorage.getItem(STORAGE_KEY);
			if (stored) {
				try {
					calculationHistory = JSON.parse(stored);
					updateHistoryDisplay();
				} catch (e) {
					console.error('Failed to load history:', e);
					calculationHistory = [];
				}
			}
		}

		// Save history to memory storage
		function saveHistory() {
			try {
				sessionStorage.setItem(STORAGE_KEY, JSON.stringify(calculationHistory));
			} catch (e) {
				console.error('Failed to save history:', e);
			}
		}

		function gcd(a, b) {
			a = Math.abs(a);
			b = Math.abs(b);
			while (b !== 0) {
				let t = b;
				b = a % b;
				a = t;
			}
			return a;
		}

		function reduceFraction(num, den) {
			const divisor = gcd(num, den);
			return [num / divisor, den / divisor];
		}

		function parseImperialInput(input) {
			input = input.trim();

			// Normalize curly quotes to straight quotes (for iOS compatibility)
			input = input.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');

			let totalInches = 0;

			const feetMatch = input.match(/(\d+\.?\d*|\d*\.?\d+)\s*'/);
			const inchesMatch = input.match(/(\d+\.?\d*|\d*\.?\d+)?\s*(\d+\/\d+)?\s*"/);

			if (feetMatch) {
				totalInches += parseFloat(feetMatch[1]) * 12;
			}

			if (inchesMatch) {
				let inchValue = 0;

				if (inchesMatch[1]) {
					inchValue += parseFloat(inchesMatch[1]);
				}

				if (inchesMatch[2]) {
					const [fNum, fDen] = inchesMatch[2].split('/').map(Number);
					inchValue += fNum / fDen;
				}

				totalInches += inchValue;
			}

			if (!feetMatch && !inchesMatch) {
				const mixedMatch = input.match(/^(\d+\.?\d*)?\s*(\d+\/\d+)?$/);
				if (mixedMatch) {
					let inchValue = 0;
					if (mixedMatch[1]) {
						inchValue += parseFloat(mixedMatch[1]);
					}
					if (mixedMatch[2]) {
						const [fNum, fDen] = mixedMatch[2].split('/').map(Number);
						inchValue += fNum / fDen;
					}
					totalInches += inchValue;
				}
			}

			return totalInches;
		}

		function inchesToImperial(inches) {
			const isNegative = inches < 0;
			inches = Math.abs(inches);

			const sixteenths = Math.round(inches * 16);

			const feet = Math.floor(sixteenths / (12 * 16));
			const remainingSixteenths = sixteenths - (feet * 12 * 16);

			const [num, den] = reduceFraction(remainingSixteenths, 16);

			const wholeInches = Math.floor(num / den);
			const fracNum = num % den;

			let result = isNegative ? '−' : '';

			if (feet > 0) {
				result += `${feet}'`;
				if (wholeInches > 0 || fracNum > 0) {
					result += ' ';
				}
			}

			if (wholeInches > 0 || fracNum > 0 || feet === 0) {
				if (wholeInches > 0) {
					result += wholeInches;
					if (fracNum > 0) {
						result += ' ';
					}
				}

				if (fracNum > 0) {
					result += `${fracNum}/${den}`;
				}

				if (wholeInches === 0 && fracNum === 0) {
					result += '0';
				}

				result += '"';
			}

			return result;
		}

		function formatAsInchesOnly(inches) {
			const isNegative = inches < 0;
			inches = Math.abs(inches);

			const sixteenths = Math.round(inches * 16);
			const [num, den] = reduceFraction(sixteenths, 16);

			let inchesDisplay = isNegative ? '−' : '';
			const wholeInches = Math.floor(num / den);
			const fracNum = num % den;

			if (wholeInches > 0) {
				inchesDisplay += wholeInches;
				if (fracNum > 0) {
					inchesDisplay += ' ';
				}
			}

			if (fracNum > 0) {
				inchesDisplay += `${fracNum}/${den}`;
			}

			if (wholeInches === 0 && fracNum === 0) {
				inchesDisplay += '0';
			}

			return `${inchesDisplay}"`;
		}

		function formatAsDecimal(inches) {
			return inches.toFixed(4).replace(/\.?0+$/, '') + '"';
		}

		function formatResult(inches) {
			if (displayAsDecimal) {
				return formatAsDecimal(inches);
			} else if (displayInInchesOnly) {
				return formatAsInchesOnly(inches);
			} else {
				return inchesToImperial(inches);
			}
		}

		function addOperator(op) {
			const input = document.getElementById('equationInput');
			let value = input.value.trim();

			// If we have a current result and input is empty, start with result
			if (currentResultInches !== null && value === '') {
				const resultStr = formatResult(currentResultInches);
				input.value = resultStr + ' ' + op + ' ';
			} else if (value && !value.endsWith(' ')) {
				// Add operator to current input
				input.value = value + ' ' + op + ' ';
			}

			// Move cursor to end
			input.focus();
			input.setSelectionRange(input.value.length, input.value.length);
		}

		function parseEquation(equation) {
			// Split by operators while keeping them
			// Use a more careful regex that preserves spaces in measurements
			const parts = [];
			let current = '';

			for (let i = 0; i < equation.length; i++) {
				const char = equation[i];

				if (['+', '-', '*', '/'].includes(char)) {
					// Check if this is an operator or part of a measurement
					// Look ahead and behind for context
					const prevChar = i > 0 ? equation[i - 1] : '';
					const nextChar = i < equation.length - 1 ? equation[i + 1] : '';

					// If preceded and followed by spaces, it's likely an operator
					if (prevChar === ' ' && nextChar === ' ') {
						if (current.trim()) parts.push(current.trim());
						parts.push(char);
						current = '';
						i++; // skip the space after operator
					} else {
						current += char;
					}
				} else {
					current += char;
				}
			}

			if (current.trim()) parts.push(current.trim());

			let values = [];
			let operators = [];

			for (let token of parts) {
				if (['+', '-', '*', '/'].includes(token)) {
					operators.push(token);
				} else {
					const inches = parseImperialInput(token);
					if (isNaN(inches)) {
						throw new Error('Invalid measurement: ' + token);
					}
					values.push(inches);
				}
			}

			// Order of operations: multiply and divide first
			let i = 0;
			while (i < operators.length) {
				if (operators[i] === '*' || operators[i] === '/') {
					const left = values[i];
					const right = values[i + 1];
					let result;

					if (operators[i] === '*') {
						result = left * right;
					} else {
						if (right === 0) throw new Error('Cannot divide by zero');
						result = left / right;
					}

					values.splice(i, 2, result);
					operators.splice(i, 1);
				} else {
					i++;
				}
			}

			// Then add and subtract
			let result = values[0];
			for (let i = 0; i < operators.length; i++) {
				if (operators[i] === '+') {
					result += values[i + 1];
				} else if (operators[i] === '-') {
					result -= values[i + 1];
				}
			}

			return result;
		}

		function calculateResult() {
			const input = document.getElementById('equationInput');
			const equation = input.value.trim();
			const errorEl = document.getElementById('error');
			const resultDisplay = document.getElementById('resultDisplay');
			const unitConvertBtn = document.getElementById('unitConvertBtn');
			const decimalConvertBtn = document.getElementById('decimalConvertBtn');

			errorEl.textContent = '';

			try {
				if (!equation) {
					throw new Error('Please enter a measurement');
				}

				const resultInches = parseEquation(equation);
				currentResultInches = resultInches;

				const resultFormatted = formatResult(resultInches);
				resultDisplay.textContent = resultFormatted;
				currentResult = resultFormatted;

				// Save to history
				addToHistory(equation, resultFormatted);

				// Clear input
				input.value = '';

				// Enable convert buttons
				unitConvertBtn.disabled = false;
				decimalConvertBtn.disabled = false;

				// Update button text based on current state
				updateConvertButtons();

			} catch (error) {
				errorEl.textContent = error.message;
				currentResultInches = null;
				currentResult = null;
				unitConvertBtn.disabled = true;
				decimalConvertBtn.disabled = true;
			}
		}

		function updateConvertButtons() {
			const unitConvertBtn = document.getElementById('unitConvertBtn');
			const decimalConvertBtn = document.getElementById('decimalConvertBtn');

			if (displayInInchesOnly) {
				unitConvertBtn.textContent = 'Convert to Feet & Inches';
			} else {
				unitConvertBtn.textContent = 'Convert to Inches';
			}

			if (displayAsDecimal) {
				decimalConvertBtn.textContent = 'Convert to Fraction';
			} else {
				decimalConvertBtn.textContent = 'Convert to Decimal';
			}
		}

		function toggleUnitDisplay() {
			if (currentResultInches === null) return;

			displayInInchesOnly = !displayInInchesOnly;
			const resultFormatted = formatResult(currentResultInches);
			document.getElementById('resultDisplay').textContent = resultFormatted;
			currentResult = resultFormatted;

			updateConvertButtons();
		}

		function toggleDecimalDisplay() {
			if (currentResultInches === null) return;

			displayAsDecimal = !displayAsDecimal;
			const resultFormatted = formatResult(currentResultInches);
			document.getElementById('resultDisplay').textContent = resultFormatted;
			currentResult = resultFormatted;

			updateConvertButtons();
		}

		function clearAll() {
			document.getElementById('equationInput').value = '';
			document.getElementById('resultDisplay').textContent = '—';
			document.getElementById('error').textContent = '';
			currentResult = null;
			currentResultInches = null;
			document.getElementById('unitConvertBtn').disabled = true;
			document.getElementById('decimalConvertBtn').disabled = true;
		}

		function addToHistory(equation, result) {
			const timestamp = new Date().toLocaleString();

			calculationHistory.unshift({
				equation,
				result,
				timestamp,
				id: Date.now()
			});

			// Keep only last 20
			if (calculationHistory.length > MAX_HISTORY) {
				calculationHistory = calculationHistory.slice(0, MAX_HISTORY);
			}

			saveHistory();
			updateHistoryDisplay();
		}

		function updateHistoryDisplay() {
			const historyList = document.getElementById('historyList');

			if (calculationHistory.length === 0) {
				historyList.innerHTML = '<div class="history-empty">No calculations saved yet</div>';
				return;
			}

			historyList.innerHTML = calculationHistory.map(calc => `
                <div class="history-item">
                    <div class="history-item-content">
                        <strong>${calc.equation} = ${calc.result}</strong><br>
                        <small style="color: #888;">${calc.timestamp}</small>
                    </div>
                    <button class="history-item-delete" onclick="event.stopPropagation(); showDeleteHistoryItemModal(${calc.id})">Delete</button>
                </div>
            `).join('');
		}

		function showDeleteHistoryItemModal(id) {
			pendingModalAction = () => deleteHistoryItem(id);
			document.getElementById('modalMessage').textContent = 'Do you want to delete this calculation from history?';
			document.getElementById('confirmModal').classList.add('show');
		}

		function showClearHistoryModal() {
			if (calculationHistory.length === 0) return;

			pendingModalAction = () => {
				calculationHistory = [];
				saveHistory();
				updateHistoryDisplay();
			};
			document.getElementById('modalMessage').textContent = 'Do you want to clear all calculation history?';
			document.getElementById('confirmModal').classList.add('show');
		}

		function deleteHistoryItem(id) {
			calculationHistory = calculationHistory.filter(calc => calc.id !== id);
			saveHistory();
			updateHistoryDisplay();
		}

		function confirmAction() {
			if (pendingModalAction) {
				pendingModalAction();
				pendingModalAction = null;
			}
			closeModal();
		}

		function closeModal() {
			document.getElementById('confirmModal').classList.remove('show');
			pendingModalAction = null;
		}

		// Allow Enter key to calculate
		document.getElementById('equationInput').addEventListener('keypress', function (e) {
			if (e.key === 'Enter') {
				calculateResult();
			}
		});

		// Load history when page loads
		loadHistory();
	</script>
</body>

</html>
